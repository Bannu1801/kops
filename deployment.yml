apiVersion: apps/v1
kind: Deployment
metadata:
  name: mydep11
  namespace: dev
  labels:
    app: dm1
spec:
  replicas: 7
  selector:
    matchLabels:
      app: dm1
  template:
    metadata:
      labels:
        app: dm1
    spec:
      containers:
        - name: cont1
          image: shammu101/game
          ports:
            - containerPort: 80
